name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test extras
        run: pip install -e ".[test]"
      - name: Run P0 auth confirm tests
        run: python -m pytest -vv --tb=short test/test_p0_auth_confirm.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel/sdist and verify metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          with zipfile.ZipFile(wheels[0]) as zf:
              meta_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              meta = Parser().parsestr(zf.read(meta_name).decode())
          with tarfile.open(sdists[0]) as tf:
              pkg_name = next(n for n in tf.getnames() if n.endswith("PKG-INFO"))
              pkg = Parser().parsestr(tf.extractfile(pkg_name).read().decode())
          assert meta["Name"] == "clawdchat-mcp"
          assert meta["Version"] == "0.1.16"
          assert pkg["Name"] == "clawdchat-mcp"
          assert pkg["Version"] == "0.1.16"
          print(f"wheel={wheels[0].name}")
          print(f"sdist={sdists[0].name}")
          print(f"metadata_ok name={meta['Name']} version={meta['Version']}")
          PY
